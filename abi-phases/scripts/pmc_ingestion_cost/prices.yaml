  qdrant_cloud:
    # Qdrant Cloud bills "CPU, memory, and disk storage usage" but publishes no
    # unit rate; prices come only from https://cloud.qdrant.io/calculator. Put a
    # calculator quote here (USD per GB of RAM per month, all-in) and re-run:
    # the managed vector column then prices Qdrant Cloud instead of S3 Vectors.
    usd_per_gb_ram_month: null
    quote: >-
      "Qdrant database clusters in Qdrant Cloud are priced based on CPU,
      memory, and disk storage usage. To get a clearer idea for the pricing
      structure, based on the amounts of vectors you want to store, please use
      our Pricing Calculator."
