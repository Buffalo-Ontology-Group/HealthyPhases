  s3_vectors:
    # Amazon S3 Vectors, us-east-1: the managed vector store with published prices.
    storage_gb_month: 0.06
    put_per_gb: 0.20
    query_per_1000: 0.0025
    max_vectors_per_index: 2000000000
    max_indexes_per_bucket: 10000
    max_dimension: 4096
    writes_per_second_per_index: 2500
    quote: >-
      "$0.06 per GB-Mo of Storage in Vectors", "$0.20 per GB fee for bytes put
      to S3 Vectors"; "Vector data - sum of vectors per index multiplied by
      average vector size (vector data, key, and filterable metadata)". PUT has
      a 128 KB minimum per request, so vectors are written 500 per call.
    source: https://aws.amazon.com/s3/pricing/
    source_limits: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-limitations.html
    retrieved: 2026-11-19

# How much RAM and disk a self-hosted Qdrant needs, by Qdrant's own formulas.
qdrant_sizing:
  hnsw_bytes_per_point: 153.6      # "hnsw_size = base * m * 2 * 4 bytes * 1.2" with m = 16
  id_tracker_bytes_per_point: 52   # "id_tracker_size = base * 52 bytes"
  headroom: 0.2                    # "~20% headroom on top of your final RAM and disk totals"
  node_ram_usable: 0.8             # "ceil(total_ram_estimate / (node_ram * 0.8))"
  quantization_ratio: {scalar_int8: 4, binary_1bit: 32}
  quote: >-
    "Scalar Quantization ... achieving 4x compression"; "Binary Quantization
    reduces each vector component to one to two bits for up to 32x
    compression". The quantized copy is kept besides the originals: RAM falls
    only when the originals move to disk, and disk holds both.
  source: https://qdrant.tech/documentation/capacity-planning/
  source_quantization: https://qdrant.tech/documentation/manage-data/quantization/
  retrieved: 2026-11-19
