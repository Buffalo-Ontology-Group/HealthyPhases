# OpenAI rate limits by usage tier. OpenAI now has three paid tiers (Build,
# Launch, Grow) reached at $5 / $100 / $500 of total credit purchases.
openai_tiers:
  thresholds_usd: {build: 5, launch: 100, grow: 500}
  monthly_usage_limit_usd: {build: 500, launch: 5000, grow: 200000}
  source: https://developers.openai.com/api/docs/guides/rate-limits
  retrieved: 2026-11-19
openai_rate_limits:
  # tpm: tokens per minute; batch_queue: input tokens enqueued per model.
  openai/gpt-4.1-mini:
    build: {rpm: 5000, tpm: 2000000, batch_queue: 20000000}
    launch: {rpm: 10000, tpm: 10000000, batch_queue: 1000000000}
    grow: {rpm: 30000, tpm: 150000000, batch_queue: 15000000000}
    source: https://developers.openai.com/api/docs/models/gpt-4.1-mini
  openai/gpt-6-luna:
    build: {rpm: 5000, tpm: 2000000, batch_queue: 20000000}
    launch: {rpm: 10000, tpm: 10000000, batch_queue: 1000000000}
    grow: {rpm: 30000, tpm: 180000000, batch_queue: 15000000000}
    source: https://developers.openai.com/api/docs/models/gpt-6-luna
  openai/gpt-5-mini:
    build: {rpm: 5000, tpm: 2000000, batch_queue: 20000000}
    launch: {rpm: 10000, tpm: 10000000, batch_queue: 1000000000}
    grow: {rpm: 30000, tpm: 180000000, batch_queue: 15000000000}
    source: https://developers.openai.com/api/docs/models/gpt-5-mini
  openai/gpt-6.1-terra:
    build: {rpm: 5000, tpm: 1000000, batch_queue: 3000000}
    launch: {rpm: 10000, tpm: 4000000, batch_queue: 200000000}
    grow: {rpm: 15000, tpm: 40000000, batch_queue: 15000000000}
    source: https://developers.openai.com/api/docs/models/gpt-6.1-terra
  text-embedding-3-large:
    build: {rpm: 5000, tpm: 1000000, batch_queue: 20000000}
    launch: {rpm: 10000, tpm: 5000000, batch_queue: 500000000}
    grow: {rpm: 10000, tpm: 10000000, batch_queue: 4000000000}
    source: https://developers.openai.com/api/docs/models/text-embedding-3-large
openai_batch:
  completion_window_hours: 24
  quote: >-
    "Each batch completes within 24 hours (and often more quickly)". "Batch API
    jobs don't count toward standard per-model request or token rate limits."
  max_requests_per_batch: 50000
  source: https://developers.openai.com/api/docs/guides/batch
