# Every price the cost model uses, with where it was read and when.
#
# Model prices are USD per 1M tokens. Change a figure here and re-run
# `cost_model.py report` to regenerate every table in PMC_INGESTION_COST.md.
# OpenAI's docs moved from platform.openai.com/docs to developers.openai.com/api/docs
# (the old URLs redirect); the URLs below are the pages actually read.
retrieved: 2026-11-19

# OpenAI's "Upcoming deprecations" table, read 2026-11-19. Columns: shutdown
# date | affected model | status | recommended replacement | notice date.
deprecations:
  openai/gpt-4.1-mini:
    notice: 2026-10-14
    shutdown: 2027-01-14
    replacement: openai/gpt-6-luna
    quote: "Jan 14, 2027 | GPT-4.1 mini (gpt-4.1-mini-2025-04-14) | Deprecated | gpt-6-luna | Oct 14, 2026"
    source: https://developers.openai.com/api/docs/deprecations
    retrieved: 2026-11-19
  openai/gpt-5-mini:
    notice: 2026-06-11
    shutdown: 2026-12-11
    replacement: openai/gpt-6.1-terra
    quote: "Dec 11, 2026 | gpt-5-mini, gpt-5-mini-2025-08-07 | Deprecated | gpt-6.1-terra | Jun 11, 2026"
    source: https://developers.openai.com/api/docs/deprecations
    retrieved: 2026-11-19

# `route` decides the fee: OpenRouter passes provider prices through and
# charges `openrouter.fee_percent` on credit purchases. `declared` is whether
# phases_v2/models/catalog.py declares the model today.
models:
  openai/gpt-4.1-mini:
    display: GPT-4.1 mini
    declared: true
    route: openai
    input: 0.40
    cached_input: 0.10
    output: 1.60
    batch_input: 0.20
    batch_output: 0.80
    source: https://developers.openai.com/api/docs/pricing
    retrieved: 2026-11-19
    note: Batch table lists no cached-input price for this model.
  openai/gpt-6-luna:
    display: GPT-6 Luna
    declared: false
    route: openai
    input: 0.10
    cached_input: 0.01
    output: 0.50
    batch_input: 0.05
    batch_output: 0.25
    source: https://developers.openai.com/api/docs/pricing
    retrieved: 2026-11-19
    note: >-
      Short-context rates (<= 272K input tokens). Reasoning model: reasoning
      tokens bill as output. Cache writes bill at 1.25x input
      (https://developers.openai.com/api/docs/models/gpt-6-luna); our prompts
      share no long prefix, so caching is not assumed.
  openai/gpt-5-mini:
    display: GPT-5 mini
    declared: true
    route: openai
    input: 0.25
    cached_input: 0.025
    output: 2.00
    batch_input: 0.125
    batch_output: 1.00
    source: https://developers.openai.com/api/docs/pricing
    retrieved: 2026-11-19
  openai/gpt-6.1-terra:
    display: GPT-6.1 Terra
    declared: false
    route: openai
    input: 1.00
    cached_input: 0.05
    output: 5.00
    batch_input: 0.50
    batch_output: 2.50
    source: https://developers.openai.com/api/docs/pricing
    retrieved: 2026-11-19
    note: OpenAI's replacement for gpt-5-mini. Short-context rates.
  openrouter/claude-sonnet-4.6:
    display: Claude Sonnet 4.6
    declared: true
    route: openrouter
    input: 3.00
    cached_input: 0.30
    output: 15.00
    batch_input: 1.50
    batch_output: 7.50
    source: https://openrouter.ai/api/v1/models
    retrieved: 2026-11-19
    note: >-
      API prices per token x 1e6, ids anthropic/claude-sonnet-4.6 and its
      :batch variant. Same as Anthropic's list price
      (https://platform.claude.com/docs/en/about-claude/pricing).
  openrouter/claude-haiku-4.5:
    display: Claude Haiku 4.5
    declared: true
    route: openrouter
    input: 1.00
    cached_input: 0.10
    output: 5.00
    batch_input: 0.50
    batch_output: 2.50
    source: https://openrouter.ai/api/v1/models
    retrieved: 2026-11-19
  openrouter/gemini-3.1-pro-preview:
    display: Gemini 3.1 Pro (preview)
    declared: true
    route: openrouter
    input: 2.00
    cached_input: 0.20
    output: 12.00
    batch_input: 1.00
    batch_output: 6.00
    source: https://openrouter.ai/api/v1/models
    retrieved: 2026-11-19
    note: >-
      Prompts <= 200k tokens (ours are ~1.7k). Output includes reasoning
      ("internal_reasoning" 0.000012/token). Same as Google's list price
      (https://aistudio.google.com/docs/pricing).

openrouter:
  fee_percent: 5.5
  quote: >-
    "OpenRouter charges a 5.5% ($0.80 minimum) fee when you purchase credits.
    We pass through the pricing of the underlying model providers without any
    markup"
  source: https://openrouter.ai/docs/faq
  retrieved: 2026-11-19
  batch:
    available: true
    discount: "Typically 50% of the sync per-token price"
    completion_window_hours: 24
    source: https://openrouter.ai/docs/guides/features/batch-api
    retrieved: 2026-11-19
  rate_limits:
    quote: >-
      "switch to the paid variant of the model, which has no platform-level
      request cap"; upstream providers may still answer 429.
    source: https://openrouter.ai/docs/api-reference/limits
    retrieved: 2026-11-19

embeddings:
  text-embedding-3-large:
    input: 0.13
    batch_input: 0.065
    dimensions: 3072
